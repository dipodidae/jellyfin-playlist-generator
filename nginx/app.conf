server {
    listen 80;
    server_name _;

    # No auth here. This container is deployed behind a reverse proxy that does
    # forward auth (see the deployment repo), and an nginx `auth_basic` here does
    # not stack with that -- it PREEMPTS it, because ngx_http_auth_basic_module
    # runs ahead of ngx_http_auth_request_module in the access phase. The proxy's
    # `error_page 401` then converts THIS 401, the auth subrequest is never made,
    # and a client holding a valid proxy session is bounced to the login page
    # forever. Measured 2026-09-04.

    # Static frontend files
    root /app/static;
    index index.html;

    # SPA fallback - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE support for streaming endpoints
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Health check endpoint. Used by the container's own HEALTHCHECK.
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
    }
}
